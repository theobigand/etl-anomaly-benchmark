[project]
name = "etl-benchmark"
version = "0.1.0"
description = "Benchmark of rule-based, classical ML, and deep learning anomaly detectors inside an ETL pipeline."
authors = [{ name = "Theo Bigand", email = "theobigand@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "great_expectations>=1.0,<2.0",
    "pyod>=2.0",
    "faker>=25",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=7.1,<8",
    "hypothesis>=6.169,<7",
    "ruff>=0.4",
    "torch>=2.1,<3",
]
deep = ["mutmut>=3.8,<4"]

[project.scripts]
etl-benchmark = "etl_benchmark.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "research/tests", "slides/tests"]
addopts = "-ra -q"
filterwarnings = ["ignore:.pin_memory. argument is set as true:UserWarning"]
markers = [
    "browser: needs a Chromium binary; deselected automatically when none is installed",
    "real: requires locally available full research datasets",
    "protocol: scientific contracts and invariants",
    "property: bounded generative scientific checks",
    "integration: ETL and persistence checks",
    "end_to_end: experiment artifact lineage checks",
    "fault: deliberate defects run on a temporary copy of the code (verify-faults)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
patch = ["subprocess"]

[tool.mutmut]
source_paths = ["src/etl_benchmark", "experiments", "research", "verification"]
only_mutate = [
    "src/etl_benchmark/*.py",
    "src/etl_benchmark/quality/*.py",
    "experiments/*.py",
    "research/*.py",
    "verification/*.py",
]
pytest_add_cli_args_test_selection = [
    "tests",
    "research/tests",
    "-m",
    "not real and not fault",
    "--deselect=tests/test_artifact_lineage.py::test_archived_runs_match_current_scientific_source",
    "--deselect=tests/test_artifact_lineage.py::test_fixed_calibration_reuses_baseline_partitions_and_current_source",
    "--deselect=tests/test_artifact_lineage.py::test_lineage_anchor_is_a_commit_that_reproduces_the_archived_recipe_1_fingerprint",
    "--deselect=tests/test_claims_provenance.py::test_the_repository_claims_name_a_run_that_exists_in_the_history",
    "--deselect=tests/test_claims_provenance.py::test_the_module_checks_the_repository_claims_from_the_command_line",
    "--deselect=tests/test_temporal_pilot.py::test_the_archived_pilot_record_identifies_this_implementation",
    "--deselect=tests/test_verifier_tools.py::test_archive_lineage_separates_legacy_records_from_broken_ones",
]
do_not_mutate = ["research/tests/*"]
# Training-heavy mutants (epochs, batch sizes) legitimately run long on hosted runners; the
# default factor of 15 reported 43 genuine detections of the LSTM detector as timeouts.
timeout_multiplier = 60.0
# PyTorch is not fork-safe: with the default process isolation the native workers either failed
# spuriously (macOS) or hung until the time limit (hosted Linux) on training-heavy mutants.
process_isolation = "forkserver"
also_copy = [
    "verification",
    "research",
    "environment.yml",
    "docs",
    "paper",
    "slides",
    ".github",
    "Makefile",
    "README.md",
]
# Only the non-Python files that tests read invalidate the cache; documents, evidence copies,
# the paper and workflows do not (verification/mutation_cache.py guards changed tests).
on_dependency_change = "rerun"
use_git_change_detection = false
cache_invalidation_files = [
    "environment.yml",
    "pyproject.toml",
    "verification/scaling.py",
    "verification/evidence/scaling.json",
    "verification/environment/*",
]
