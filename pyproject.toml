[project]
name = "etl-benchmark"
version = "0.1.0"
description = "Benchmark of rule-based, classical ML, and deep learning anomaly detectors inside an ETL pipeline."
authors = [{ name = "Theo Bigand", email = "theobigand@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "great_expectations>=1.0,<2.0",
    "pyod>=2.0",
    "faker>=25",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=7.1,<8",
    "hypothesis>=6.169,<7",
    "ruff>=0.4",
]
deep = ["mutmut>=3.8,<4"]

[project.scripts]
etl-benchmark = "etl_benchmark.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "real: requires locally available full research datasets",
    "protocol: scientific contracts and invariants",
    "property: bounded generative scientific checks",
    "integration: ETL and persistence checks",
    "end_to_end: experiment artifact lineage checks",
    "fault: deliberate defects run on a temporary copy of the code (verify-faults)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
patch = ["subprocess"]

[tool.mutmut]
source_paths = ["src/etl_benchmark", "experiments"]
only_mutate = [
    "src/etl_benchmark/datasets.py",
    "src/etl_benchmark/extract.py",
    "src/etl_benchmark/load.py",
    "src/etl_benchmark/metrics.py",
    "src/etl_benchmark/pipeline.py",
    "src/etl_benchmark/registry.py",
    "src/etl_benchmark/split.py",
    "src/etl_benchmark/synthetic.py",
    "src/etl_benchmark/transform.py",
    "src/etl_benchmark/quality/*.py",
    "experiments/*.py",
]
pytest_add_cli_args_test_selection = [
    "tests",
    "-m",
    "not real",
    "--ignore=tests/test_artifact_lineage.py",
    "--ignore=tests/test_publication_tables.py",
    "--ignore=tests/test_profile_refresh.py",
    "--ignore=tests/test_scaling_study.py",
    "--ignore=tests/test_test_support.py",
    "--ignore=tests/test_fault_matrix.py",
    "--ignore=tests/test_verification_policy.py",
    "--ignore=tests/test_evidence_schema.py",
    "--ignore=tests/test_release_gate.py",
    "--ignore=tests/test_verifier_tools.py",
    "--ignore=tests/test_reproduce.py",
    "--ignore=tests/test_manuscript_claims.py",
    "--ignore=tests/test_check_types.py",
    "--ignore=tests/test_environment_lock.py",
    "--ignore=tests/test_workflows.py",
    "--ignore=tests/test_branch_protection.py",
    "--ignore=tests/test_claims_provenance.py",
    "--ignore=tests/test_evidence_bundles.py",
    "--ignore=tests/test_mutation_scope.py",
]
also_copy = ["verification", "environment.yml"]
on_dependency_change = "rerun"
