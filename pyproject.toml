[project]
name = "etl-benchmark"
version = "0.1.0"
description = "Benchmark of rule-based, classical ML, and deep learning anomaly detectors inside an ETL pipeline."
authors = [{ name = "Theo Bigand", email = "theobigand@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "great_expectations>=1.0,<2.0",
    "pyod>=2.0",
    "faker>=25",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
etl-benchmark = "etl_benchmark.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
