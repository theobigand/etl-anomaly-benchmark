name: Organize thesis remediation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/thesis-roadmap-sync.yml"
      - "docs/thesis-remediation/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: thesis-roadmap-organization
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout roadmap
        uses: actions/checkout@v4

      - name: Validate tasks and synchronize GitHub milestones and labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = 'docs/thesis-remediation';
            const config = JSON.parse(fs.readFileSync(path.join(root, 'tracking.json'), 'utf8'));
            const files = fs.readdirSync(root).filter(f => /^\d{2}-.*\.md$/.test(f));
            const ids = files.flatMap(f => [...fs.readFileSync(path.join(root, f), 'utf8')
              .matchAll(/^- \[[ xX]\] T(\d{3}) /gm)].map(m => Number(m[1])));
            const unique = new Set(ids);
            if (ids.length !== 415 || unique.size !== 415 ||
                Array.from({length: 415}, (_, i) => i + 1).some(id => !unique.has(id))) {
              throw new Error('The roadmap must contain exactly T001–T415, each once');
            }
            const historicalOpen = config.historical_open_issues ?? [];
            const historicalClosed = config.historical_closed_issues ?? [];
            if (config.issues.length !== 16 || config.milestones.length !== 8) {
              throw new Error('Unexpected core roadmap issue or milestone inventory');
            }
            const active = [...config.issues, ...historicalOpen];
            const allNumbers = [...active, ...historicalClosed].map(item => item.number);
            if (new Set(allNumbers).size !== allNumbers.length) {
              throw new Error('An issue appears more than once in the roadmap configuration');
            }
            const { owner, repo } = context.repo;
            const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner, repo, per_page: 100
            });
            const labelNames = new Set(existingLabels.map(l => l.name));
            for (const label of config.labels) {
              if (!labelNames.has(label.name)) {
                await github.rest.issues.createLabel({
                  owner, repo, name: label.name, color: label.color,
                  description: label.description
                });
                labelNames.add(label.name);
              }
            }
            const existingMilestones = await github.paginate(github.rest.issues.listMilestones, {
              owner, repo, state: 'all', per_page: 100
            });
            const milestones = new Map(existingMilestones.map(m => [m.title, m.number]));
            for (const milestone of config.milestones) {
              if (!milestones.has(milestone.title)) {
                const response = await github.rest.issues.createMilestone({
                  owner, repo, title: milestone.title,
                  description: milestone.description, state: 'open'
                });
                milestones.set(milestone.title, response.data.number);
              }
            }
            for (const item of active) {
              const milestone = milestones.get(item.milestone);
              if (!milestone) throw new Error('Unknown milestone: ' + item.milestone);
              const current = await github.rest.issues.get({
                owner, repo, issue_number: item.number
              });
              if (current.data.state !== 'open') {
                throw new Error('Tracked active issue is not open: #' + item.number);
              }
              await github.rest.issues.addLabels({
                owner, repo, issue_number: item.number, labels: item.labels
              });
              if (current.data.milestone?.number !== milestone) {
                await github.rest.issues.update({
                  owner, repo, issue_number: item.number, milestone
                });
              }
            }
            for (const item of historicalClosed) {
              const current = await github.rest.issues.get({
                owner, repo, issue_number: item.number
              });
              if (current.data.state !== 'closed') {
                throw new Error('Archived issue must remain closed: #' + item.number);
              }
              await github.rest.issues.addLabels({
                owner, repo, issue_number: item.number, labels: item.labels
              });
            }
            core.info('Verified 415 tasks and synchronized ' +
              active.length + ' open issues, ' +
              historicalClosed.length + ' archived issues, ' +
              config.milestones.length + ' milestones, and ' +
              config.labels.length + ' labels.');
