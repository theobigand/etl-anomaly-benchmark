name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: FAST verification
        run: make verify-fast

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-fast
          path: |
            coverage.json
            experiments/results/pytest.xml
            experiments/results/verification_fast.json
            verification/profile.json
          if-no-files-found: warn
          retention-days: 30
